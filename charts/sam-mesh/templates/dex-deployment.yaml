{{/*
Dex config body. Named so the Deployment can checksum it: nothing else would restart Dex
when the issuer or the redirect URIs change.
*/}}
{{- define "sam-mesh.dexConfig" -}}
issuer: {{ .Values.dex.issuer | default (printf "http://%s-dex:%v/dex" (include "sam-mesh.fullname" .) .Values.dex.service.port) }}
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  skipApprovalScreen: true
staticClients:
- id: sam-console
  redirectURIs:
  {{- if .Values.dex.redirectURIs }}
  {{- range .Values.dex.redirectURIs }}
  - {{ . | quote }}
  {{- end }}
  {{- else }}
  - http://localhost:9092/auth/callback
  - http://127.0.0.1:9092/auth/callback
  {{- end }}
  name: 'SAM Console'
  public: true
enablePasswordDB: true
staticPasswords:
- email: admin@example.com
  # bcrypt hash for 'password'
  hash: "$2a$10$TUOgJVdtu0AL6Y6TcNBQXOSjRWRKhIkC0kXDzN9kOkPB4hg2aFPE2"
  username: admin
  userID: "0898fa90-3453-4311-8566-020953250212"
{{- end }}
{{- if .Values.dex.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sam-mesh.fullname" . }}-dex-config
  labels:
    {{- include "sam-mesh.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- include "sam-mesh.dexConfig" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sam-mesh.fullname" . }}-dex
  labels:
    {{- include "sam-mesh.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "sam-mesh.fullname" . }}-dex
  template:
    metadata:
      labels:
        app: {{ include "sam-mesh.fullname" . }}-dex
      annotations:
        checksum/config: {{ include "sam-mesh.dexConfig" . | sha256sum }}
    spec:
      nodeSelector:
        sam-role: control-plane
      containers:
      - name: dex
        image: "{{ .Values.dex.image.repository }}:{{ .Values.dex.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        args:
        - dex
        - serve
        - /etc/dex/cfg/config.yaml
        ports:
        - containerPort: 5556
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/dex/cfg
      volumes:
      - name: config
        configMap:
          name: {{ include "sam-mesh.fullname" . }}-dex-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sam-mesh.fullname" . }}-dex
  labels:
    {{- include "sam-mesh.labels" . | nindent 4 }}
spec:
  type: {{ .Values.dex.service.type }}
  selector:
    app: {{ include "sam-mesh.fullname" . }}-dex
  ports:
  - name: http
    port: {{ .Values.dex.service.port }}
    targetPort: 5556
    {{- if and (eq .Values.dex.service.type "NodePort") .Values.dex.service.nodePort }}
    nodePort: {{ .Values.dex.service.nodePort }}
    {{- end }}
{{- end }}
