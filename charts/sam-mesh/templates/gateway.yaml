{{- if .Values.gateway.enabled -}}
{{- $fullName := include "sam-mesh.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $fullName }}-gateway
  labels:
    {{- include "sam-mesh.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-control-plane
  labels:
    {{- include "sam-mesh.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ $fullName }}-gateway
  rules:
  # The enrollment surface, matching the cloud's allow-list exactly.
  - matches:
    - path:
        type: Exact
        value: /register
    - path:
        type: Exact
        value: /info
    - path:
        type: Exact
        value: /keys
    - path:
        type: Exact
        value: /routers/lease
    - path:
        type: Exact
        value: /policies
    - path:
        type: Exact
        value: /enroll
    - path:
        type: Exact
        value: /enroll/status
    - path:
        type: Exact
        value: /refresh
    backendRefs:
    - name: {{ $fullName }}-control-plane
      port: {{ .Values.controlPlane.service.port }}
  {{- if .Values.gateway.adminRoute }}
  - matches:
    - path:
        type: PathPrefix
        value: /admin
    backendRefs:
    - name: {{ $fullName }}-control-plane
      port: {{ .Values.controlPlane.service.port }}
  {{- end }}
{{- if .Values.console.enabled }}
---
# Own Gateway rather than /console on the main one: that needs a prefix rewrite, which
# cloud-provider-kind does not implement, and the frontend uses relative URLs.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $fullName }}-console-gateway
  labels:
    {{- include "sam-mesh.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-console
  labels:
    {{- include "sam-mesh.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ $fullName }}-console-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ $fullName }}-console
      port: {{ .Values.console.service.port }}
{{- end }}
{{- if .Values.dex.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $fullName }}-dex-gateway
  labels:
    {{- include "sam-mesh.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-dex
  labels:
    {{- include "sam-mesh.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ $fullName }}-dex-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ $fullName }}-dex
      port: {{ .Values.dex.service.port }}
{{- end }}
{{- end }}
