{{/*
Renders one Gateway. listeners, addresses and annotations are passed through verbatim, so
any provider's TLS, static-address or annotation shape is expressible from values.
Call with: (dict "root" $ "suffix" "-gateway" "override" $someOverride)
*/}}
{{- define "sam-mesh.gateway" -}}
{{- $gateway := .root.Values.gateway -}}
{{- $override := .override -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "sam-mesh.fullname" .root }}{{ .suffix }}
  labels:
    {{- include "sam-mesh.labels" .root | nindent 4 }}
  {{- with ($override.annotations | default $gateway.annotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ required "gateway.className is required when gateway.enabled is true" $gateway.className }}
  {{- with ($override.addresses | default $gateway.addresses) }}
  addresses:
    {{- toYaml . | nindent 2 }}
  {{- end }}
  listeners:
    {{- toYaml ($override.listeners | default $gateway.listeners) | nindent 2 }}
{{- end -}}
{{- if .Values.gateway.enabled -}}
{{- $fullName := include "sam-mesh.fullname" . -}}
{{- $controlPlaneGateway := .Values.gateway.controlPlane | default dict -}}
{{- $consoleGateway := .Values.gateway.console | default dict -}}
{{- $dexGateway := .Values.gateway.dex | default dict -}}
{{ include "sam-mesh.gateway" (dict "root" $ "suffix" "-gateway" "override" $controlPlaneGateway) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-control-plane-route
  labels:
    {{- include "sam-mesh.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ $fullName }}-gateway
  {{- with ($controlPlaneGateway.hostnames | default .Values.gateway.hostnames) }}
  hostnames:
    {{- toYaml . | nindent 2 }}
  {{- end }}
  rules:
  # The enrollment surface, matching the cloud's allow-list exactly.
  - matches:
    - path:
        type: Exact
        value: /register
    - path:
        type: Exact
        value: /info
    - path:
        type: Exact
        value: /keys
    - path:
        type: Exact
        value: /routers/lease
    - path:
        type: Exact
        value: /policies
    - path:
        type: Exact
        value: /enroll
    - path:
        type: Exact
        value: /enroll/status
    - path:
        type: Exact
        value: /refresh
    backendRefs:
    - name: {{ $fullName }}-control-plane
      port: {{ .Values.controlPlane.service.port }}
  {{- if .Values.gateway.adminRoute }}
  - matches:
    - path:
        type: PathPrefix
        value: /admin
    backendRefs:
    - name: {{ $fullName }}-control-plane
      port: {{ .Values.controlPlane.service.port }}
  {{- end }}
  {{- if and .Values.console.enabled .Values.console.basePath }}
  # Plain prefix, no rewrite filter: the console serves this path itself, because the
  # chart passes it as --base-path.
  - matches:
    - path:
        type: PathPrefix
        value: {{ .Values.console.basePath }}
    backendRefs:
    - name: {{ $fullName }}-console
      port: {{ .Values.console.service.port }}
  {{- end }}
{{- if and .Values.console.enabled (not .Values.console.basePath) }}
---
# No console.basePath, so the console gets its own Gateway and serves at /.
{{ include "sam-mesh.gateway" (dict "root" $ "suffix" "-console-gateway" "override" $consoleGateway) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-console-route
  labels:
    {{- include "sam-mesh.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ $fullName }}-console-gateway
  {{- with ($consoleGateway.hostnames | default .Values.gateway.hostnames) }}
  hostnames:
    {{- toYaml . | nindent 2 }}
  {{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ $fullName }}-console
      port: {{ .Values.console.service.port }}
{{- end }}
{{- if .Values.dex.enabled }}
---
{{ include "sam-mesh.gateway" (dict "root" $ "suffix" "-dex-gateway" "override" $dexGateway) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-dex-route
  labels:
    {{- include "sam-mesh.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ $fullName }}-dex-gateway
  {{- with ($dexGateway.hostnames | default .Values.gateway.hostnames) }}
  hostnames:
    {{- toYaml . | nindent 2 }}
  {{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ $fullName }}-dex
      port: {{ .Values.dex.service.port }}
{{- end }}
{{- end }}
