{{- if .Values.router.enabled -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sam-mesh.fullname" . }}-router-sa
  labels:
    {{- include "sam-mesh.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sam-mesh.fullname" . }}-router
  labels:
    {{- include "sam-mesh.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "sam-mesh.fullname" . }}-router
  replicas: {{ .Values.router.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "sam-mesh.fullname" . }}-router
  template:
    metadata:
      labels:
        app: {{ include "sam-mesh.fullname" . }}-router
    spec:
      serviceAccountName: {{ include "sam-mesh.fullname" . }}-router-sa
      {{- with .Values.router.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.router.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      - name: wait-control-plane
        image: curlimages/curl:8.6.0
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          CP_URL="http://{{ include "sam-mesh.fullname" . }}-control-plane:{{ .Values.controlPlane.service.port }}"
          until curl -sf "${CP_URL}/info" > /dev/null; do
            echo "Control plane not ready yet, sleeping..."
            sleep 2
          done
      containers:
      - name: sam-router
        image: "{{ .Values.router.image.repository }}:{{ .Values.global.imageTag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: 4501
          name: p2p-tcp
          {{- if .Values.router.hostPort }}
          hostPort: {{ .Values.router.hostPort }}
          {{- end }}
          protocol: TCP
        - containerPort: 4501
          name: p2p-udp
          {{- if .Values.router.hostPort }}
          hostPort: {{ .Values.router.hostPort }}
          {{- end }}
          protocol: UDP
        readinessProbe:
          tcpSocket:
            port: p2p-tcp
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: p2p-tcp
          periodSeconds: 15
        resources:
          {{- toYaml .Values.router.resources | nindent 10 }}
        env:
        {{- if not .Values.router.useOidcToken }}
        - name: BOOTSTRAP_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "sam-mesh.fullname" . }}-router-token
              key: token
        {{- end }}
        {{- if .Values.router.hostPort }}
        # kubelet expands $(HOST_IP) in the args below.
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        {{- end }}
        args:
        - "--control-plane=http://{{ include "sam-mesh.fullname" . }}-control-plane:{{ .Values.controlPlane.service.port }}"
        - "--listen=/ip4/0.0.0.0/tcp/4501"
        - "--listen=/ip4/0.0.0.0/udp/4501/quic-v1"
        {{- if .Values.router.externalAddrs }}
        {{- range .Values.router.externalAddrs }}
        - "--external-addr={{ . }}"
        {{- end }}
        {{- else if .Values.router.hostPort }}
        - "--external-addr=/ip4/$(HOST_IP)/tcp/{{ .Values.router.hostPort }}"
        - "--external-addr=/ip4/$(HOST_IP)/udp/{{ .Values.router.hostPort }}/quic-v1"
        {{- else }}
        - "--external-addr=/dns4/{{ include "sam-mesh.fullname" . }}-router/tcp/4501"
        {{- end }}
        - "--keys-path=/data/router.key"
        {{- if .Values.router.allowLoopback }}
        - "--allow-loopback"
        {{- end }}
        - "--log-level={{ .Values.router.logLevel }}"
        {{- if .Values.router.useOidcToken }}
        - "--jwt-path=/var/run/secrets/tokens/sam-token"
        {{- else }}
        - "--bootstrap-token=$(BOOTSTRAP_TOKEN)"
        {{- end }}
        volumeMounts:
        - name: router-data
          mountPath: /data
        {{- if .Values.router.useOidcToken }}
        - name: sam-token
          mountPath: /var/run/secrets/tokens
          readOnly: true
        {{- end }}
      volumes:
      - name: router-data
        emptyDir: {}
      {{- if .Values.router.useOidcToken }}
      - name: sam-token
        projected:
          sources:
          - serviceAccountToken:
              path: sam-token
              expirationSeconds: 3600
              audience: "sam-control-plane-audience"
      {{- end }}
{{- end }}
