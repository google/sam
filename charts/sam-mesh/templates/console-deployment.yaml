{{- if .Values.console.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sam-mesh.fullname" . }}-console
  labels:
    {{- include "sam-mesh.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.console.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "sam-mesh.fullname" . }}-console
  template:
    metadata:
      labels:
        app: {{ include "sam-mesh.fullname" . }}-console
      annotations:
        # The console discovers the issuer from /info once, at startup, and registers its
        # /auth routes only if that succeeds. Restart it when the issuer changes.
        checksum/oidc-issuer: {{ .Values.controlPlane.oidcIssuer | sha256sum }}
    spec:
      initContainers:
      - name: wait-control-plane
        image: curlimages/curl:8.6.0
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          CP_URL="http://{{ include "sam-mesh.fullname" . }}-control-plane:{{ .Values.controlPlane.service.port }}"
          until curl -sf "${CP_URL}/info" > /dev/null; do
            echo "Control plane not ready yet, sleeping..."
            sleep 2
          done
      containers:
      - name: sam-console
        image: "{{ .Values.console.image.repository }}:{{ .Values.global.imageTag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        env:
        - name: SAM_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "sam-mesh.fullname" . }}-secrets
              key: admin-token
        ports:
        - containerPort: 8081
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /info
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /info
            port: http
          periodSeconds: 15
        resources:
          {{- toYaml .Values.console.resources | nindent 10 }}
        args:
        - "--control-plane=http://{{ include "sam-mesh.fullname" . }}-control-plane:{{ .Values.controlPlane.service.port }}"
        - "--bind-addr=:8081"
        - "--static-dir=/app/public"{{- end }}
