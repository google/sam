global:
  imageTag: local
  imagePullPolicy: IfNotPresent

# One Gateway per externally-reachable service, each with its own HTTPRoute. No route uses
# an HTTPRoute filter, so any conformant controller can serve them.
gateway:
  enabled: false
  # Required when enabled. No default: the GatewayClass is provider-specific, e.g.
  # cloud-provider-kind in kind, gke-l7-global-external-managed on GKE.
  className: ""
  # Routes the control plane's /admin API. Dev only; the cloud leaves it unrouted.
  adminRoute: false
  # listeners, hostnames, addresses and annotations pass through to the Gateway API
  # objects verbatim, so anything the spec allows is expressible. These are the defaults
  # for every gateway; plain HTTP on 80 matching any host suits a local cluster.
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
  hostnames: []
  addresses: []
  annotations: {}
  # Per-gateway overrides. Any of the four above set here replaces the shared value for
  # that gateway alone — one certificate or provider annotation per hostname.
  controlPlane: {}
  console: {}
  dex: {}

controlPlane:
  replicaCount: 2
  image:
    repository: sam-control-plane
  logLevel: info
  # Leave empty to auto-generate a random admin token on first install (kept
  # stable across upgrades). Set explicitly (e.g. via --set) to pin a known value.
  adminToken: ""
  autoApproveEnrollment: true
  # Only skips TLS verification for the OIDC issuer; leave false unless
  # pointing at a local/dev issuer without a valid certificate.
  insecureSkipTlsVerify: false
  oidcIssuer: "http://sam-mesh-dex:5556/dex"
  allowedAudiences: "sam-mesh-audience,sam-control-plane-audience"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8080
    nodePort: null

database:
  type: postgres
  postgres:
    deployInternal: true
    image:
      repository: postgres
      tag: 16-alpine
    user: sam
    # Leave empty to auto-generate a random password on first install (kept
    # stable across upgrades). Set explicitly (e.g. via --set) to pin a known value.
    password: ""
    database: sam_mesh
    port: 5432
    sslmode: disable
    storageSize: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

router:
  enabled: true
  replicaCount: 1
  podSecurityContext:
    fsGroup: 65532
    fsGroupChangePolicy: "OnRootMismatch"
  image:
    repository: sam-router
  useOidcToken: false
  logLevel: info
  # Binds 4501 TCP+UDP on the router's own node and announces /ip4/<node IP>/... for both
  # transports. One router per node.
  hostPort: null
  # Overrides the announced multiaddrs; derived from hostPort when left empty.
  externalAddrs: []
  allowLoopback: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 4501

console:
  enabled: true
  replicaCount: 1
  image:
    repository: sam-console
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 8081
    nodePort: null

dex:
  enabled: false
  # Public URL clients discover Dex at; defaults to its in-cluster Service URL.
  issuer: ""
  # Console callback URLs allowed for the sam-console client; defaults to localhost.
  redirectURIs: []
  service:
    type: ClusterIP
    port: 5556
  image:
    repository: dexidp/dex
    tag: v2.39.0
  google:
    clientId: ""
    clientSecret: ""
  github:
    clientId: ""
    clientSecret: ""
  cliOAuthSecret: ""

bootstrap:
  bindings: []

