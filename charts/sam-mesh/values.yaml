global:
  imageTag: local
  imagePullPolicy: IfNotPresent

# One Gateway per externally-reachable service, each on HTTP :80. No route uses an
# HTTPRoute filter: cloud-provider-kind implements neither path redirect nor path rewrite.
gateway:
  enabled: false
  className: cloud-provider-kind
  # Routes the control plane's /admin API. Dev only; the cloud leaves it unrouted.
  adminRoute: false

controlPlane:
  replicaCount: 2
  image:
    repository: sam-control-plane
  logLevel: info
  # Leave empty to auto-generate a random admin token on first install (kept
  # stable across upgrades). Set explicitly (e.g. via --set) to pin a known value.
  adminToken: ""
  autoApproveEnrollment: true
  # Only skips TLS verification for the OIDC issuer; leave false unless
  # pointing at a local/dev issuer without a valid certificate.
  insecureSkipTlsVerify: false
  oidcIssuer: "http://sam-mesh-dex:5556/dex"
  allowedAudiences: "sam-mesh-audience,sam-control-plane-audience"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8080
    nodePort: null

database:
  type: postgres
  postgres:
    deployInternal: true
    image:
      repository: postgres
      tag: 16-alpine
    user: sam
    # Leave empty to auto-generate a random password on first install (kept
    # stable across upgrades). Set explicitly (e.g. via --set) to pin a known value.
    password: ""
    database: sam_mesh
    port: 5432
    sslmode: disable
    storageSize: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

router:
  enabled: true
  replicaCount: 1
  podSecurityContext:
    fsGroup: 65532
    fsGroupChangePolicy: "OnRootMismatch"
  image:
    repository: sam-router
  useOidcToken: false
  logLevel: info
  # Binds 4501 TCP+UDP on the router's own node and announces /ip4/<node IP>/... for both
  # transports. One router per node.
  hostPort: null
  # Overrides the announced multiaddrs; derived from hostPort when left empty.
  externalAddrs: []
  allowLoopback: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 4501

console:
  enabled: true
  replicaCount: 1
  image:
    repository: sam-console
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 8081
    nodePort: null

dex:
  enabled: false
  # Public URL clients discover Dex at; defaults to its in-cluster Service URL.
  issuer: ""
  # Console callback URLs allowed for the sam-console client; defaults to localhost.
  redirectURIs: []
  service:
    type: ClusterIP
    port: 5556
  image:
    repository: dexidp/dex
    tag: v2.39.0
  google:
    clientId: ""
    clientSecret: ""
  github:
    clientId: ""
    clientSecret: ""
  cliOAuthSecret: ""

bootstrap:
  bindings: []

