# The agent bundle: who this agent is, and what it may reach.
#
# The bundle is read by sam-box, outside the sandbox. The agent never sees it
# and cannot change it, which is the point: an agent that could edit its own
# policy would not be constrained by one.
version: v1

agent:
  # The mesh identity of this agent. Dot-separated and hierarchical, because
  # policy matches on label boundaries: a rule for `*.prod.acme.example` admits
  # this agent, and `evil-prod.acme.example` is not a match for it.
  id: researcher-1.prod.acme.example

  # The platform identity this claim is checked against. sam-box verifies a
  # credential from the issuer names in --credential-issuer and only accepts
  # the bundle if the credential's subject is this value, so writing the file
  # is not enough to become this agent.
  external_id: system:serviceaccount:agents:researcher

egress:
  # Everything not listed is refused, including DNS, because the sandbox has no
  # resolver and the boundary answers by name. An empty list means the agent
  # reaches the mesh and nothing else, which is the right default for an agent
  # whose work is entirely tools and inference.
  allow:
    - api.github.com
    - "*.githubusercontent.com"
