# Dev-only Dex for the kind mesh. Dex is an independent component, so it lives here, not
# in the Helm chart. run.sh applies this with envsubst, filling ${DEX_ISSUER} and
# ${CONSOLE_REDIRECT_URI} once the gateway addresses exist.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sam-mesh-dex-config
data:
  config.yaml: |
    issuer: ${DEX_ISSUER}
    storage:
      type: memory
    web:
      http: 0.0.0.0:5556
    oauth2:
      skipApprovalScreen: true
    staticClients:
    - id: sam-console
      redirectURIs:
      - ${CONSOLE_REDIRECT_URI}
      # The sam-node CLI and the mobile app log in through Dex's device flow or a
      # loopback browser callback; Dex rejects both unless listed here.
      - /device/callback
      # Fixed ports from internal/node/oidc.go and mobile/sam-node-app/lib/main.dart.
      - http://127.0.0.1:13000/callback
      - http://127.0.0.1:13001/callback
      - http://127.0.0.1:13002/callback
      name: 'SAM Console'
      public: true
    enablePasswordDB: true
    staticPasswords:
    # The control plane auto-registers a first-time OIDC login with the "user" role, so
    # this account is not an admin however it is named.
    - email: user@example.com
      # bcrypt hash for 'password'
      hash: "$2a$10$TUOgJVdtu0AL6Y6TcNBQXOSjRWRKhIkC0kXDzN9kOkPB4hg2aFPE2"
      username: user
      userID: "0898fa90-3453-4311-8566-020953250212"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sam-mesh-dex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sam-mesh-dex
  template:
    metadata:
      labels:
        app: sam-mesh-dex
    spec:
      nodeSelector:
        sam-role: control-plane
      containers:
      - name: dex
        image: dexidp/dex:v2.39.0
        args:
        - dex
        - serve
        - /etc/dex/cfg/config.yaml
        ports:
        - containerPort: 5556
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/dex/cfg
      volumes:
      - name: config
        configMap:
          name: sam-mesh-dex-config
---
apiVersion: v1
kind: Service
metadata:
  name: sam-mesh-dex
spec:
  selector:
    app: sam-mesh-dex
  ports:
  - name: http
    port: 5556
    targetPort: 5556
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sam-mesh-dex-gateway
spec:
  gatewayClassName: cloud-provider-kind
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sam-mesh-dex-route
spec:
  parentRefs:
  - name: sam-mesh-dex-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: sam-mesh-dex
      port: 5556
