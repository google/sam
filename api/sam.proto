syntax = "proto3";
package sam.v1;
option go_package = "github.com/google/sam/api";



message AuthFrame {
  bytes biscuit = 1;
  string target_service = 2; // Optional: specific service requested

  // The agent this request is made for, as a canonical agent identifier (see
  // api/agent.go). It is the calling node's claim, carried beside the token
  // because Biscuit hides an appended block's facts from the authorizer; the
  // HTTP datapath carries the same claim in HeaderSamAgent.
  string agent = 3;
}

message AuthResponse {
  bool success = 1;
  string error = 2; // populated only if success is false
  bytes biscuit = 3; // The server's own Biscuit token (for mutual auth)
}



message MeshEvent {
  enum Type {
    BANNED = 0;
    KEY_ROTATION = 1;
    POLICY_UPDATE = 2;
  }
  Type type = 1;
  string peer_id = 2;
  int64 timestamp = 3;
  bytes new_public_key = 4;
  bytes signature = 5;
}

message EnrollRequest {
  string jwt = 1;
  string peer_id = 2;
  bytes public_key = 3;
  string requested_role = 4;
  // Operator-declared labels (e.g. key "region", see api/labels.go).
  // Validated fail-closed by the control plane and, once attested by the
  // enrollment flow's gates, minted as signed label() facts in the
  // biscuit. Empty means no claims.
  map<string, string> labels = 5;
}

message EnrollResponse {
  bytes biscuit_token = 1;
  string error_message = 2;
  bytes control_plane_public_key = 3;
  repeated string router_addresses = 4;
  int64 expiration = 5;
}

message EnrollmentStatusRequest {
  string peer_id = 1;
}

enum EnrollmentStatus {
  ENROLLMENT_STATUS_UNSPECIFIED = 0;
  ENROLLMENT_STATUS_PENDING = 1;
  ENROLLMENT_STATUS_APPROVED = 2;
  ENROLLMENT_STATUS_REJECTED = 3;
}

message BootstrapEnrollRequest {
  string bootstrap_token = 1;
  string peer_id = 2;
  bytes public_key = 3;
  string requested_role = 4;
  // Operator-declared labels; the admin approving the enrollment attests
  // them (see EnrollRequest.labels).
  map<string, string> labels = 5;
}

message BootstrapEnrollResponse {
  EnrollmentStatus status = 1;
  bytes biscuit_token = 2;         // Populated only if APPROVED
  int32 poll_interval_seconds = 3; // Recommended polling wait time
  string error_message = 4;
  bytes control_plane_public_key = 5;   // Populated only if APPROVED
  repeated string router_addresses = 6; // Populated only if APPROVED
  int64 expiration = 7;             // Populated only if APPROVED
}



enum ServiceType {
  SERVICE_TYPE_UNSPECIFIED = 0;
  SERVICE_TYPE_MCP = 1;
  SERVICE_TYPE_INFERENCE = 2;
}

message ServiceInfo {
  ServiceType type = 1;
  string name = 2;
  string description = 3;
}

message CommandBackend {
  repeated string command = 1;
  map<string, string> env = 2;
}

message RegisterServiceRequest {
  ServiceInfo service = 1;
  oneof backend {
    string target_url = 2;
    CommandBackend command = 3;
  }
}

message DiscoveredProvider {
  string peer_id = 1;
  string local_proxy_url = 2;
  string srv_name = 3;
  string srv_description = 4;
}

// ServiceAnnounce is gossiped by a node on per-key topics (see
// DiscoveryTopic) while those topics have subscribers. It is a routing
// hint signed at the pubsub layer by the announcing peer: consumers use
// it for freshness and load awareness, never for authorization.
message ServiceAnnounce {
  string peer_id = 1;
  ServiceType type = 2;
  string service_name = 3;
  // Routing keys served by this service: model IDs for inference,
  // tool names for MCP.
  repeated string keys = 4;
  // Operator-declared labels (e.g. "region"). Operator claims always
  // take precedence over runtime-derived values.
  map<string, string> labels = 5;
  // Runtime load hints; zero values mean unknown.
  uint32 active_requests = 6;
  double latency_ewma_ms = 7;
  int64 timestamp = 8;
}

message ControlPlaneInfoResponse {
  string oidc_issuer = 1;
  string client_id = 2;
  string audience = 3;
  repeated string router_addresses = 4;
}

message RouterLeaseRequest {
  string peer_id = 1;
  repeated string addresses = 2;
  bytes biscuit = 3;
  repeated string connected_peers = 4;
  int32 dht_size = 5;
}

message RouterLeaseResponse {
  bool success = 1;
  string error = 2;
  int64 expires_at = 3;
}

message PolicyRole {
  string name = 1;
  repeated string allowed_targets = 2;
  repeated string allowed_services = 3;
  repeated string custom_datalog = 4;
}

message PolicyBinding {
  string role = 1;
  repeated string members = 2;
}

message PolicyConfigGetRequest {}

message PolicyConfigGetResponse {
  repeated PolicyRole roles = 1;
  repeated PolicyBinding bindings = 2;
}

message PolicyConfigUpdateRequest {
  repeated PolicyRole roles = 1;
  repeated PolicyBinding bindings = 2;
}

message PolicyConfigUpdateResponse {
  bool success = 1;
  string error = 2;
}

message KeysResponse {
  repeated bytes public_keys = 1;
}

message TokenRefreshRequest {
  bytes challenge_signature = 1;
  int64 timestamp = 2;
}

message TokenRefreshResponse {
  bytes biscuit_token = 1;
  int64 expires_at = 2;
  string error_message = 3;
}

message TokenRevokeRequest {
  string peer_id = 1;
}

message TokenRevokeResponse {
  bool success = 1;
  string error = 2;
}


// ============================================================================
// Agent Sandbox Connector API
// ============================================================================
//
// The interface an agent scheduler (Agent Substrate, or any other) implements
// to place agents on the mesh. It is host-local and served on a control socket
// that is deliberately not reachable from inside a sandbox: identity must never
// arrive in band from the agent itself, which could only lie about it.

// AgentSecret configures credential injection for one destination. It carries
// a path, never a value: secret material must not travel through this API.
message AgentSecret {
  string host = 1;
  string kind = 2;        // bearer | basicauth | customheader
  string header_name = 3; // customheader only
  string value_path = 4;
}

// AgentEgress is deny-by-default. Patterns are matched against the destination
// name taken from the sandbox boundary, never against a resolved address.
message AgentEgress {
  repeated string allow = 1;
  repeated AgentSecret secrets = 2;
}

// AgentIngress declares that the agent serves a mesh service. The name is the
// service half of the mesh host the rest of the mesh dials (see api/names.go);
// port is where the agent listens inside its sandbox.
message AgentIngress {
  ServiceType type = 1;
  string name = 2;
  uint32 port = 3;
  string description = 4;
}

// AgentBundle is everything the platform declares about one agent. Its
// canonical form is a YAML file in the agent's own state directory, so that a
// suspend/resume onto another host carries it with no extra machinery; this
// message is the transport mirror of that file.
message AgentBundle {
  string version = 1;

  // Canonical mesh identifier, without the "agent:" prefix. Dot-separated and
  // DNS-shaped; see api/agent.go for the rules and why they exist.
  string agent_id = 2;

  // The platform's own identifier, verbatim, kept for audit because the
  // translation into agent_id is not always reversible.
  string external_id = 3;

  // Path to the workload credential the platform already issues: a projected
  // Kubernetes service-account token, a pod certificate, or an SVID. It is
  // verified at admission against the platform's issuer and then translated
  // into agent facts, the same way OIDC claims are translated at node
  // enrollment. The scheduler needs no mesh credential of its own.
  string credential_path = 4;

  AgentEgress egress = 5;
  repeated AgentIngress ingress = 6;
}

// AgentAttachRequest admits an agent. It is idempotent on agent_id: resuming
// after a crash or a migration is another Attach, not a distinct operation.
message AgentAttachRequest {
  AgentBundle bundle = 1;
}

message AgentAttachResponse {
  // Sandbox boundary endpoints to wire into the sandbox: SOCKS5 for guest to
  // host, and a reverse channel for host to guest that is empty when the
  // bundle declares no ingress.
  string egress_socket = 1;
  string ingress_socket = 2;
  string error = 3;
}

// AgentDetachRequest stops an agent: ingress is unregistered, channels are
// closed and credentials dropped. It must leave no residual advertisement.
message AgentDetachRequest {
  string agent_id = 1;
}

message AgentDetachResponse {
  bool success = 1;
  string error = 2;
}

// AgentRefreshRequest hands in a rotated workload credential. Platforms rotate
// these on their own schedule, which is what bounds how long a stale admission
// stays usable.
message AgentRefreshRequest {
  string agent_id = 1;
  string credential_path = 2;
}

message AgentRefreshResponse {
  bool success = 1;
  string error = 2;
  int64 expires_at = 3;
}

// AgentStatusRequest reports on one agent, or on all of them when agent_id is
// empty, for a scheduler's reconcile loop.
message AgentStatusRequest {
  string agent_id = 1;
}

message AgentStatus {
  string agent_id = 1;
  bool attached = 2;
  repeated AgentIngress ingress = 3;
  int64 credential_expires_at = 4;
}

message AgentStatusResponse {
  repeated AgentStatus agents = 1;
  string error = 2;
}



