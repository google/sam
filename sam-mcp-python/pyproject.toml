[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sam-mcp"
version = "0.1.0"
description = "Python SDK for Sovereign Agent Mesh (SAM) using MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=1.6.2",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.sdist]
include = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/sam_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "strict"
